{% extends "base.html" %}
{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
<style>
.method-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:20px 0;}
.method-card{background:#121212;border:2px solid #333;border-radius:10px;padding:15px;
             cursor:pointer;transition:border-color 0.3s;text-align:center;}
.method-card:hover,.method-card.selected{border-color:#ffb700;}
.method-card input[type="radio"]{display:none;}
.method-icon{font-size:1.6rem;display:block;margin-bottom:5px;}
.method-label{color:#fff;font-size:0.9rem;font-weight:600;}
</style>
{% endblock %}
{% block body_class %}page-login{% endblock %}
{% block content %}
<div class="login-container" style="width:460px;">
    <div class="brand-logo">TUT<span>0</span>HUB</div>
    <h2>Recuperar Contrasena</h2>
    <p style="color:#aaa;margin-bottom:20px;">Elige como quieres recuperar tu cuenta.</p>
    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="input-group">
            <label>Tu correo electronico</label>
            <input type="email" name="email" required placeholder="tu@email.com">
        </div>
        <p style="color:#ffb700;font-weight:600;margin-bottom:8px;">Metodo de recuperacion:</p>
        <div class="method-grid">
            <label class="method-card selected" id="card-email">
                <input type="radio" name="method" value="email" checked onchange="selectMethod(this)">
                <span class="method-icon">@</span>
                <span class="method-label">Email</span>
            </label>
            <label class="method-card" id="card-sms">
                <input type="radio" name="method" value="sms" onchange="selectMethod(this)">
                <span class="method-icon">#</span>
                <span class="method-label">SMS (simulado)</span>
            </label>
            <label class="method-card" id="card-call">
                <input type="radio" name="method" value="call" onchange="selectMethod(this)">
                <span class="method-icon">T</span>
                <span class="method-label">Llamada (simulada)</span>
            </label>
            <label class="method-card" id="card-question">
                <input type="radio" name="method" value="question" onchange="selectMethod(this)">
                <span class="method-icon">?</span>
                <span class="method-label">Pregunta secreta</span>
            </label>
        </div>
        <button type="submit" class="btn-primary" style="margin-top:10px;">CONTINUAR</button>
    </form>
    <p style="margin-top:20px;">
        <a href="{{ url_for('auth.login') }}" style="color:#aaa;">Volver al login</a>
    </p>
</div>
<script>
function selectMethod(radio){
    document.querySelectorAll('.method-card').forEach(c=>c.classList.remove('selected'));
    radio.closest('.method-card').classList.add('selected');
}
</script>
{% endblock %}
