{% extends "base.html" %}
{% block extra_css %}<link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">{% endblock %}
{% block body_class %}page-login{% endblock %}
{% block content %}
<div class="login-container">
    <div class="brand-logo">TUT<span>0</span>HUB</div>
    <h2>Nueva Contrasena</h2>
    <form method="POST" id="resetForm">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="input-group">
            <label>Nueva Contrasena</label>
            <input type="password" name="password" id="pw" required minlength="8"
                   placeholder="Minimo 8 caracteres con letras y numeros">
        </div>
        <div class="input-group">
            <label>Confirmar Contrasena</label>
            <input type="password" name="password_confirm" id="pw2" required
                   placeholder="Repite la contrasena">
        </div>
        <button type="submit" class="btn-primary">CAMBIAR CONTRASENA</button>
    </form>
</div>
<script>
document.getElementById('pw2').addEventListener('input', function(){
    this.setCustomValidity(
        this.value !== document.getElementById('pw').value
        ? 'Las contrasenas no coinciden' : ''
    );
});
</script>
{% endblock %}
